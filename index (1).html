<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photobooth Walimatulurus Syaraff &amp; Aishah</title>
<style>
  :root{--maroon:#5a0f1c;--maroon2:#3a0811;--gold:#d9b46a;--gold2:#f3dc9f;--ink:#fff7e8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#4a0c17,#1c0408 70%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:6px}
  #stage{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:6px;cursor:pointer;background:#000}
  body.kiosk #stageWrap{padding:0}
  #kioskFab{position:fixed;right:14px;bottom:14px;display:none;gap:10px;z-index:5}
  body.kiosk #kioskFab{display:flex}
  #kioskFab button{background:rgba(30,4,10,.55);backdrop-filter:blur(4px)}
  #countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(30vw,40vh);font-weight:bold;color:var(--gold2);text-shadow:0 0 30px rgba(0,0,0,.8),0 0 6px #000;pointer-events:none;opacity:0}
  #countdown.show{animation:pop 1s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(1.6)}20%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.8)}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.go{animation:flash .6s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;pointer-events:none}
  #msg h1{margin:0;font-size:clamp(24px,4.2vh,44px);color:var(--gold2);font-style:italic}
  #msg p{margin:0;max-width:min(340px,80vw);line-height:1.5;opacity:.9}
  #msg button{pointer-events:auto}
  #bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.35);border-top:1px solid rgba(217,180,106,.35)}
  button,select,label.btn{font:inherit;font-size:15px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--gold2);padding:9px 18px;cursor:pointer}
  button:hover,label.btn:hover{background:rgba(217,180,106,.15)}
  button.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--maroon2);font-weight:bold;font-size:18px;padding:12px 30px;border:none}
  button:disabled{opacity:.4;cursor:default}
  select{background:var(--maroon2);border-radius:8px}
  .grp{display:flex;align-items:center;gap:6px;font-size:14px}
  #gallery{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:rgba(0,0,0,.45);min-height:0}
  #gallery:empty{display:none}
  #gallery img{height:72px;border-radius:4px;border:2px solid transparent;cursor:pointer;flex:none}
  #gallery img:hover{border-color:var(--gold)}
  #review{position:fixed;inset:0;background:rgba(10,2,4,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:10}
  #review.open{display:flex}
  #review img{max-width:95vw;max-height:78vh;border-radius:6px;box-shadow:0 10px 40px #000}
  #review .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  body.kiosk #bar{display:none}
  body:not(.settings) #bar .adv{display:none}
  body.kiosk #gallery{display:none}
  .hint{font-size:12px;opacity:.6}
</style>
</head>
<body>
<div id="app">
  <div id="stageWrap">
    <canvas id="stage" width="1080" height="1920" title="Klik untuk ambil gambar"></canvas>
    <div id="msg">
      <h1>Photobooth Walimatulurus</h1>
      <p>Tekan <b>Buka Kamera</b> dan benarkan akses kamera. Selepas itu tekan butang <b>Ambil Gambar</b>, klik pada skrin, atau tekan kekunci <b>Space</b>.</p>
      <button class="primary" id="startBtn">Buka Kamera</button>
    </div>
    <div id="countdown"></div>
    <div id="flash"></div>
  </div>
  <div id="bar">
    <button class="primary" id="shootBtn" disabled>📸 Ambil Gambar</button>
    <div class="grp adv">Orientasi <select id="orient"><option value="portrait">Potret</option><option value="landscape">Landskap</option></select></div>
    <div class="grp adv">Kira detik
      <select id="timer"><option value="0">Tiada</option><option value="3" selected>3 saat</option><option value="5">5 saat</option><option value="10">10 saat</option></select>
    </div>
    <div class="grp adv">Kamera <select id="camSel"><option>—</option></select></div>
    <button class="adv" id="mirrorBtn">↔ Cermin: Ya</button>
    <button class="adv" id="autoBtn">Simpan automatik: Tidak</button>
    <label class="btn adv">🖼 Tukar frame<input type="file" id="frameFile" accept="image/png,image/webp" hidden></label>
    <button class="adv" id="allBtn" disabled>⬇ Muat turun semua (0)</button>
    <button id="setBtn">⚙ Tetapan</button>
    <button id="kioskBtn">⛶ Mod Kiosk</button>
  </div>
  <div id="gallery"></div>
</div>
<div id="kioskFab"><button class="primary" id="fabShoot">📸</button><button id="fabExit">✕</button></div>

<div id="review">
  <img id="reviewImg" alt="Gambar">
  <div class="row">
    <button class="primary" id="dlBtn">⬇ Muat Turun</button>
    <button id="retakeBtn">🔁 Ambil Semula</button>
    <button id="closeBtn">✔ Teruskan</button>
  </div>
  <div class="hint">Gambar disimpan dalam galeri di bawah sepanjang sesi ini.</div>
</div>

  g.fillStyle = '#111'; g.fillRect(0,0,W,H);
  if(stream && video.videoWidth){
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.max(HOLE.w/vw, HOLE.h/vh);
    const dw = vw*s, dh = vh*s, dx = HOLE.x + (HOLE.w-dw)/2, dy = HOLE.y + (HOLE.h-dh)/2;
    g.save(); g.beginPath(); g.rect(HOLE.x,HOLE.y,HOLE.w,HOLE.h); g.clip();
    if(mirror){ g.translate(HOLE.x*2+HOLE.w,0); g.scale(-1,1); }
    g.drawImage(video, dx, dy, dw, dh);
    g.restore();
  }
  if(frame.complete && frame.naturalWidth) g.drawImage(frame,0,0,W,H);
}
function draw(){ render(ctx); requestAnimationFrame(draw); }

async function listCams(){
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  const sel = $('camSel'); const cur = stream && stream.getVideoTracks()[0].getSettings().deviceId;
  sel.innerHTML = devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label||'Kamera '+(i+1)}</option>`).join('');
}
async function startCam(deviceId){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    const v = {width:{ideal:1920}, height:{ideal:1080}};
    if(deviceId) v.deviceId = {exact:deviceId}; else v.facingMode = 'user';
    stream = await navigator.mediaDevices.getUserMedia({video:v, audio:false});
    video.srcObject = stream; await video.play();
    $('msg').style.display = 'none'; $('shootBtn').disabled = false;
    listCams();
  }catch(e){
    $('msg').querySelector('p').innerHTML = 'Kamera tidak dapat dibuka (' + e.name + '). Pastikan kebenaran kamera dibenarkan dalam pelayar, dan buka fail ini dalam Chrome/Edge. Jika anda membuka melalui pautan artifak, cuba muat turun fail HTML dan buka terus.';
  }
}

function beep(f,len){ try{ const a = beep.ac || (beep.ac = new AudioContext()); const o=a.createOscillator(), g=a.createGain(); o.frequency.value=f; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+len); o.start(); o.stop(a.currentTime+len);}catch(e){} }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

async function shoot(){
  if(!stream || busy) return; busy = true; $('shootBtn').disabled = true;
  const n = +$('timer').value, cd = $('countdown');
  for(let i=n;i>0;i--){ cd.textContent=i; cd.classList.remove('show'); void cd.offsetWidth; cd.classList.add('show'); beep(880,.15); await sleep(1000); }
  cd.textContent='';
  const c = document.createElement('canvas'); c.width=W; c.height=H; render(c.getContext('2d'));
  beep(1400,.25); const fl=$('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  const url = c.toDataURL('image/jpeg', .92);
  counter++; const name = `Walimatulurus_Syaraff_Aishah_${String(counter).padStart(3,'0')}.jpg`;
  const shot = {url,name}; shots.push(shot); addThumb(shot);
  if(autoSave) download(shot);
  busy = false; $('shootBtn').disabled = false;
  if(!autoSave) openReview(shot);
}
function addThumb(s){
  const img = new Image(); img.src = s.url; img.title = s.name; img.onclick = ()=>openReview(s);
  $('gallery').prepend(img);
  $('allBtn').disabled = false; $('allBtn').textContent = `⬇ Muat turun semua (${shots.length})`;
}
function openReview(s){ current = s; $('reviewImg').src = s.url; $('review').classList.add('open'); }
function closeReview(){ $('review').classList.remove('open'); }
function download(s){ const a=document.createElement('a'); a.href=s.url; a.download=s.name; document.body.appendChild(a); a.click(); a.remove(); }

$('startBtn').onclick = ()=>startCam();
$('shootBtn').onclick = shoot;
stage.onclick = ()=>{ if(stream) shoot(); };
$('camSel').onchange = e=>startCam(e.target.value);
$('mirrorBtn').onclick = e=>{ mirror=!mirror; e.target.textContent='↔ Cermin: '+(mirror?'Ya':'Tidak'); };
$('autoBtn').onclick = e=>{ autoSave=!autoSave; e.target.textContent='Simpan automatik: '+(autoSave?'Ya':'Tidak'); };
$('dlBtn').onclick = ()=>current && download(current);
$('retakeBtn').onclick = ()=>{ closeReview(); shoot(); };
$('closeBtn').onclick = closeReview;
$('allBtn').onclick = async ()=>{ for(const s of shots){ download(s); await sleep(400); } };
$('setBtn').onclick = ()=>document.body.classList.toggle('settings');
$('orient').onchange = e=>setOrient(e.target.value);
$('fabShoot').onclick = e=>{e.stopPropagation(); shoot();};
$('fabExit').onclick = ()=>$('kioskBtn').onclick();
$('kioskBtn').onclick = ()=>{
  document.body.classList.toggle('kiosk');
  if(document.body.classList.contains('kiosk')) document.documentElement.requestFullscreen?.().catch(()=>{});
  else if(document.fullscreenElement) document.exitFullscreen();
};
$('frameFile').onchange = e=>{ const f=e.target.files[0]; if(f){ frame.src = URL.createObjectURL(f); } };
document.addEventListener('keydown', e=>{
  if(e.code==='Space' || e.code==='Enter'){ e.preventDefault(); if($('review').classList.contains('open')) closeReview(); else shoot(); }
  if(e.code==='Escape') closeReview();
});
let saved=null; try{saved=localStorage.getItem('pb_orient')}catch(e){}
setOrient(saved || 'portrait');
</script>
